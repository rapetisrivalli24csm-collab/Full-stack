<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Control Room</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #101820;
            color: #f5f5f5;
        }

        .control-room {
            width: min(760px, 100%);
            padding: 35px;
            border: 1px solid #3b4a58;
            border-radius: 20px;
            background: #18232d;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .tag {
            color: #58d6c3;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .description {
            color: #aeb8c2;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .display {
            padding: 28px;
            border-radius: 15px;
            background: #0d151c;
            border: 1px solid #34424e;
            margin-bottom: 25px;
        }

        .display-label {
            color: #71808e;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        #message {
            font-size: 26px;
            color: #58d6c3;
            margin-bottom: 15px;
        }

        #status {
            color: #aeb8c2;
            font-size: 14px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        button {
            padding: 15px;
            border: 1px solid #3b4a58;
            border-radius: 10px;
            background: #202e39;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        button:hover {
            background: #58d6c3;
            color: #101820;
            transform: translateY(-2px);
        }

        .attribute-box {
            margin-top: 22px;
            padding: 18px;
            border-left: 4px solid #58d6c3;
            background: #202e39;
        }

        #linkDemo {
            color: #58d6c3;
        }

        @media (max-width: 600px) {
            .control-room {
                padding: 24px;
            }

            h1 {
                font-size: 32px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="control-room">

        <p class="tag">JAVASCRIPT / DOM LAB</p>

        <h1>DOM Control Room</h1>

        <p class="description">
            This page demonstrates how JavaScript can dynamically
            change webpage content, styles and HTML attributes.
        </p>

        <section class="display">

            <p class="display-label">LIVE DOM OUTPUT</p>

            <h2 id="message">System waiting...</h2>

            <p id="status">
                Choose a control below to manipulate the webpage.
            </p>

        </section>

        <section class="buttons">

            <button id="contentButton">
                Change Content
            </button>

            <button id="styleButton">
                Change Style
            </button>

            <button id="attributeButton">
                Change Attribute
            </button>

        </section>

        <div class="attribute-box">

            <p>
                Attribute demonstration:
            </p>

            <a
                id="linkDemo"
                href="https://www.google.com"
                target="_blank"
            >
                Open Demo Link
            </a>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
