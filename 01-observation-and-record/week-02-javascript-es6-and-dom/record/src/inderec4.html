<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Webpage using JavaScript</title>

    <link rel="stylesheet" href="stylerec4.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Dynamic Webpage</h1>
            <p>Developed using JavaScript DOM Manipulation</p>
        </header>

        <main>

            <section class="input-section">

                <h2>Enter Your Details</h2>

                <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter your name"
                >

                <input
                    type="text"
                    id="courseInput"
                    placeholder="Enter your course"
                >

                <button id="displayBtn">
                    Display Details
                </button>

            </section>

            <section class="output-section">

                <h2>Dynamic Output</h2>

                <div id="output">
                    <p>Enter your details and click the button.</p>
                </div>

            </section>

        </main>

        <footer>
            <p>Experiment 4 | Dynamic Webpage using JavaScript</p>
        </footer>

    </div>

    <script src="scriptrec4.js"></script>

</body>
</html>
